<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Earth - NYC Antipode View</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #050508;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        
        #canvas-container { width: 100vw; height: 100vh; }
        
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 16px;
            text-align: center;
        }
        
        .spinner {
            width: 36px;
            height: 36px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: #4ecdc4;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            pointer-events: none;
        }
        
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255,100,100,0.4);
        }
        
        #crosshair::before {
            width: 1px;
            height: 100%;
            left: 50%;
        }
        
        #crosshair::after {
            width: 100%;
            height: 1px;
            top: 50%;
        }
        
        #controls-dropdown {
            position: absolute;
            bottom: 20px;
            left: 20px;
        }

        #controls-toggle {
            background: linear-gradient(135deg, rgba(20,20,40,0.9) 0%, rgba(40,40,80,0.9) 100%);
            border: 1px solid rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.7);
            padding: 7px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
            backdrop-filter: blur(10px);
            transition: border-color 0.2s;
        }

        #controls-toggle:hover {
            border-color: rgba(255,255,255,0.35);
            color: #fff;
        }

        #controls-panel {
            display: none;
            position: absolute;
            bottom: calc(100% + 8px);
            left: 0;
            background: rgba(10,10,25,0.92);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            padding: 12px 16px;
            backdrop-filter: blur(12px);
            white-space: nowrap;
        }

        #controls-panel.open { display: block; }

        #controls-panel table { border-collapse: collapse; }

        #controls-panel td {
            color: rgba(255,255,255,0.75);
            font-size: 12px;
            padding: 3px 0;
        }

        #controls-panel td:first-child {
            color: #4ecdc4;
            font-weight: 600;
            padding-right: 16px;
        }
        
        .nav-btn {
            position: absolute;
            right: 20px;
            background: linear-gradient(135deg, rgba(20,20,40,0.9) 0%, rgba(40,40,80,0.9) 100%);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }
        
        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            border-color: rgba(255,255,255,0.3);
        }

            top: 20px;
            background: linear-gradient(135deg, rgba(78,205,196,0.2) 0%, rgba(40,80,80,0.9) 100%);

        let surfaceNormal;      // Points away from Earth center (our "up")
        let tangentNorth;       // Points toward north along the tangent plane
        let tangentEast;        // Points east along the tangent plane
        
        // Home position (NYC)
        let homePosition = null;
        let homeLookDirection = null;
        let homeUpVector = null;

        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(CONFIG.backgroundColor);
            
            // Camera positioned at NYC, looking toward center/antipode
            // Natural FOV (~60°) - minimal distortion, mimics human vision
            // Objects only change appearance when you move position, not when you look around
            camera = new THREE.PerspectiveCamera(
                60,
                window.innerWidth / window.innerHeight,
                1.0,  // Increased near plane for depth precision at scale
                CONFIG.globeRadius * 50  // Far plane scales with globe
            );
            
            // Position camera exactly ON the surface at NYC (within the tangent plane)
            const nycPos = latLongToVector3(CONFIG.nycLat, CONFIG.nycLon, CONFIG.globeRadius);
            camera.position.copy(nycPos);
            
            // Calculate tangent plane basis vectors at NYC
            // Surface normal points away from Earth center (our "up" when standing on surface)
            surfaceNormal = nycPos.clone().normalize();
            
            // World up (toward north pole)
            const worldUp = new THREE.Vector3(0, 1, 0);
            
            // Tangent east = worldUp × surfaceNormal (pointing east along surface)
            tangentEast = new THREE.Vector3().crossVectors(worldUp, surfaceNormal).normalize();
            
            // Tangent north = surfaceNormal × tangentEast (pointing north along surface)
            tangentNorth = new THREE.Vector3().crossVectors(surfaceNormal, tangentEast).normalize();
            
            // Initial look direction: toward the antipode (through center of Earth)
            const antipodePos = latLongToVector3(CONFIG.antipodeLat, CONFIG.antipodeLon, CONFIG.globeRadius);
            lookDirection = antipodePos.clone().sub(camera.position).normalize();
            
            // Initial up vector: world up projected to be perpendicular to look direction
            const worldY = new THREE.Vector3(0, 1, 0);
            const right = new THREE.Vector3().crossVectors(lookDirection, worldY).normalize();
            upVector = new THREE.Vector3().crossVectors(right, lookDirection).normalize();
            
            // Apply initial look
            updateCameraLook();
            
            // Save home position
            homePosition = camera.position.clone();
            homeLookDirection = lookDirection.clone();
            homeUpVector = upVector.clone();
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            // Mouse controls for looking around
            renderer.domElement.addEventListener('mousedown', onMouseDown);
            renderer.domElement.addEventListener('mousemove', onMouseMove);
            renderer.domElement.addEventListener('mouseup', onMouseUp);
            renderer.domElement.addEventListener('mouseleave', onMouseUp);
            
            // Keyboard controls
            window.addEventListener('keydown', onKeyDown);
            window.addEventListener('keyup', onKeyUp);
            
            // Click to move toward crosshairs
            renderer.domElement.addEventListener('click', onCanvasClick);
            
            // Return to NYC button
            document.getElementById('home-btn').addEventListener('click', returnToNYC);
            
            // Center view button
            document.getElementById('center-btn').addEventListener('click', goToCenter);

            // Controls dropdown
            const toggleBtn = document.getElementById('controls-toggle');
            const panel = document.getElementById('controls-panel');
            toggleBtn.addEventListener('click', () => panel.classList.toggle('open'));
            
            // Lighting (from nyc-view.html)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const light1 = new THREE.DirectionalLight(0xffffff, 0.6);
            light1.position.set(5, 5, 5);
            scene.add(light1);

            const light2 = new THREE.DirectionalLight(0x88aaff, 0.3);
            light2.position.set(-5, -5, -5);
            scene.add(light2);
            
            // Globe container
            globe = new THREE.Group();
            scene.add(globe);
            
            // Add starfield background
            createStarfield();

            // Add red marker at antipode
            createAntipodeDot();

            // Create city lights
            createCityLights();
            
            // Create grid lines (Tropic of Cancer southward only)
            createGridLines();
            
            window.addEventListener('resize', onWindowResize);
        }
        
        function createStarfield() {
            // Create thousands of stars as points
            const starCount = 8000;
            const starGeometry = new THREE.BufferGeometry();
            const starPositions = [];
            
            for (let i = 0; i < starCount; i++) {
                // Random position scaled with globe size
                const radius = CONFIG.globeRadius * 10 + Math.random() * CONFIG.globeRadius * 10;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                
                const x = radius * Math.sin(phi) * Math.cos(theta);
                const y = radius * Math.sin(phi) * Math.sin(theta);
                const z = radius * Math.cos(phi);
                
                starPositions.push(x, y, z);
            }
            
            starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
            
            const starMaterial = new THREE.PointsMaterial({
                color: 0xffffff,
                size: Math.sqrt(SCALE) * 1.5,  // Scales with sqrt for visibility
                sizeAttenuation: true
            });
            
            const stars = new THREE.Points(starGeometry, starMaterial);
            scene.add(stars);
        }
        
        function createNYCGroundMarker() {
            // 2 sq ft reference square at NYC
            // Earth radius = 6,371 km, globe radius = 5 units
            // Scale: 1 unit = 1,274.2 km
            // Reference square scaled with globe
            const size = 0.006 * SCALE;
            const geometry = new THREE.PlaneGeometry(size, size);
            const material = new THREE.MeshBasicMaterial({ 
                color: 0x00ff88,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.8
            });
            
            const marker = new THREE.Mesh(geometry, material);
            
            // Position at NYC on globe surface
            const nycPos = latLongToVector3(CONFIG.nycLat, CONFIG.nycLon, CONFIG.globeRadius + 0.0002 * SCALE);
            marker.position.copy(nycPos);
            
            // Orient to lie flat on the tangent plane (perpendicular to surface normal)
            marker.lookAt(0, 0, 0);
            marker.rotateX(Math.PI / 2); // Lay flat
            
            scene.add(marker);
            
            // Add a small label/outline
            const outlineGeometry = new THREE.EdgesGeometry(geometry);
            const outlineMaterial = new THREE.LineBasicMaterial({ color: 0xffffff });
            const outline = new THREE.LineSegments(outlineGeometry, outlineMaterial);
            outline.position.copy(nycPos);
            outline.lookAt(0, 0, 0);
            outline.rotateX(Math.PI / 2);
            scene.add(outline);
        }
        
        function createAntipodeDot() {
            const pos = latLongToVector3(CONFIG.antipodeLat, CONFIG.antipodeLon, CONFIG.globeRadius + 0.005 * SCALE);

            // Red marker sphere
            const dotGeometry = new THREE.SphereGeometry(0.015 * SCALE, 16, 16);
            const dotMaterial = new THREE.MeshBasicMaterial({ color: 0xff4444 });
            const dot = new THREE.Mesh(dotGeometry, dotMaterial);
            dot.position.copy(pos);
            scene.add(dot);

            // Red ring around the antipode
            const ringGeometry = new THREE.RingGeometry(0.03 * SCALE, 0.045 * SCALE, 48);
            const ringMaterial = new THREE.MeshBasicMaterial({
                color: 0xff4444,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.6
            });
            const ring = new THREE.Mesh(ringGeometry, ringMaterial);
            ring.position.copy(pos);
            ring.lookAt(0, 0, 0);
            scene.add(ring);
        }
        
        function createCityLights() {
            CITIES.forEach(city => {
                const [name, lat, lon, brightness] = city;
                
                // North America is now visible - include all cities
                
                // Larger, brighter lights - scaled LINEARLY with globe so they
                // stay visible from across the planet (sqrt scaling made them
                // sub-pixel at large SCALE)
                const size = (0.02 + (brightness - 1) * 0.015) * SCALE;
                const geometry = new THREE.SphereGeometry(size, 12, 12);
                const material = new THREE.MeshBasicMaterial({
                    color: 0xffeeaa,  // Warmer, brighter yellow
                    transparent: true,
                    opacity: 0
                });
                
                const pos = latLongToVector3(lat, lon, CONFIG.globeRadius + 0.002 * SCALE);
                const light = new THREE.Mesh(geometry, material);
                light.position.copy(pos);
                
                scene.add(light);
                cityLights.push({ mesh: light, lat, lon, brightness });
                
                // Add a glow halo for major cities (brightness >= 4)
                if (brightness >= 4) {
                    const glowSize = size * 2.5;
                    const glowGeometry = new THREE.SphereGeometry(glowSize, 12, 12);
                    const glowMaterial = new THREE.MeshBasicMaterial({
                        color: 0xffcc66,
                        transparent: true,
                        opacity: 0
                    });
                    const glow = new THREE.Mesh(glowGeometry, glowMaterial);
                    glow.position.copy(pos);
                    scene.add(glow);
                    cityLights.push({ mesh: glow, lat, lon, brightness: brightness * 0.4, isGlow: true });
                }
            });
        }
        
        function createGridLines() {
            // Full globe grid lines
            const gridMaterial = new THREE.LineBasicMaterial({
                color: 0x3388aa,  // Teal color
                transparent: false,
                opacity: 1.0
            });

            // Key latitude lines (full globe)
            const latitudes = [
                66.5,    // Arctic Circle
                23.5,    // Tropic of Cancer
                0,       // Equator
                -23.5,   // Tropic of Capricorn
                -66.5    // Antarctic Circle
            ];

            const gridOffset = 0.001 * SCALE;  // Scale grid line height

            latitudes.forEach(lat => {
                const points = [];
                for (let lon = -180; lon <= 180; lon += 3) {
                    points.push(latLongToVector3(lat, lon, CONFIG.globeRadius + gridOffset));
                }
                const geometry = new THREE.BufferGeometry().setFromPoints(points);
                const line = new THREE.Line(geometry, gridMaterial);
                scene.add(line);
            });

            // Longitude lines every 30° - full pole to pole
            for (let lon = -180; lon < 180; lon += 30) {
                const points = [];
                for (let lat = 90; lat >= -90; lat -= 3) {
                    points.push(latLongToVector3(lat, lon, CONFIG.globeRadius + gridOffset));
                }
                const geometry = new THREE.BufferGeometry().setFromPoints(points);
                const line = new THREE.Line(geometry, gridMaterial);
                scene.add(line);
            }
        }
        
        // ============================================
        // SOLAR POSITION & DAY/NIGHT
        // ============================================
        
        function getSolarPosition() {
            const now = new Date(simulatedTime);
            const utcHours = now.getUTCHours() + now.getUTCMinutes() / 60 + now.getUTCSeconds() / 3600;
            
            const start = new Date(now.getUTCFullYear(), 0, 0);
            const diff = now - start;
            const dayOfYear = Math.floor(diff / (1000 * 60 * 60 * 24));
            
            // Solar declination (latitude of subsolar point)
            const declination = 23.44 * Math.sin((2 * Math.PI / 365) * (dayOfYear - 81));
            
            // Subsolar longitude
            const subsolarLon = (12 - utcHours) * 15;
            
            return { lat: declination, lon: subsolarLon };
        }
        
        function isInDaylight(lat, lon, solarPos) {
            const lat1 = solarPos.lat * Math.PI / 180;
            const lon1 = solarPos.lon * Math.PI / 180;
            const lat2 = lat * Math.PI / 180;
            const lon2 = lon * Math.PI / 180;
            
            const cosAngle = Math.sin(lat1) * Math.sin(lat2) + 
                           Math.cos(lat1) * Math.cos(lat2) * Math.cos(lon2 - lon1);
            const angle = Math.acos(Math.max(-1, Math.min(1, cosAngle))) * 180 / Math.PI;
            
            if (angle < 84) return 1;
            if (angle > 96) return 0;
            return 1 - (angle - 84) / 12;
        }
        
        function updateDayNight() {
            const solarPos = getSolarPosition();
            
            // Update country colors
            countryMeshes.forEach(item => {
                const dayAmount = isInDaylight(item.lat, item.lon, solarPos);
                const dayColor = new THREE.Color(item.dayColor);
                const nightColor = new THREE.Color(NIGHT_COLOR);
                const blended = dayColor.lerp(nightColor, 1 - dayAmount);
                item.mesh.material.color = blended;
            });
            
            // Update city lights - exaggerated brightness
            cityLights.forEach(city => {
                const dayAmount = isInDaylight(city.lat, city.lon, solarPos);
                const nightAmount = 1 - dayAmount;
                
                if (city.isGlow) {
                    // Glow halos - softer, more spread
                    city.mesh.material.opacity = Math.pow(nightAmount, 1.5) * (city.brightness / 5) * 0.4;
                } else {
                    // Main lights - bright and punchy, night only
                    city.mesh.material.opacity = Math.pow(nightAmount, 1.5) * (city.brightness / 5) * 1.0;
                }
            });
            
            // Advance time
            simulatedTime += 16 * CONFIG.timeSpeed;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ============================================
        // LOOK-AROUND CONTROLS
        // ============================================
        
        function onMouseDown(e) {
            isMouseDown = true;
            isDragging = false;
            wasDragging = false;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        }
        
        function onMouseMove(e) {
            // Only respond if mouse button is held down
            if (!isMouseDown) return;
            
            const deltaX = e.clientX - lastMouseX;
            const deltaY = e.clientY - lastMouseY;
            
            // Only count as dragging if moved more than a few pixels
            if (Math.abs(deltaX) > 3 || Math.abs(deltaY) > 3) {
                isDragging = true;
                wasDragging = true;
            }
            
            if (!isDragging) return;
            
            const DRAG_SENSITIVITY = 0.003;
            
            // Horizontal drag = yaw (rotate around world Y axis)
            const yawAxis = new THREE.Vector3(0, 1, 0);
            lookDirection.applyAxisAngle(yawAxis, -deltaX * DRAG_SENSITIVITY);
            upVector.applyAxisAngle(yawAxis, -deltaX * DRAG_SENSITIVITY);
            
            // Vertical drag = pitch (rotate toward/away from Y axis)
            const rightVector = new THREE.Vector3().crossVectors(lookDirection, upVector).normalize();
            lookDirection.applyAxisAngle(rightVector, -deltaY * DRAG_SENSITIVITY);
            upVector.applyAxisAngle(rightVector, -deltaY * DRAG_SENSITIVITY);
            
            // Keep vectors normalized
            lookDirection.normalize();
            upVector.normalize();
            
            updateCameraLook();
            
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        }
        
        function onMouseUp() {
            isMouseDown = false;
            isDragging = false;
        }
        
        function onCanvasClick(e) {
            // Only move if it wasn't a drag
            if (wasDragging) {
                wasDragging = false;
                return;
            }
            
            // Move camera in the look direction
            const movement = lookDirection.clone().multiplyScalar(MOVE_SPEED);
            camera.position.add(movement);
            
            // Recalculate tangent plane vectors for new position
            updateTangentPlane();
            updateCameraLook();
        }
        
        function returnToNYC() {
            // Reset to home position
            camera.position.copy(homePosition);
            lookDirection = homeLookDirection.clone();
            upVector = homeUpVector.clone();
            
            // Recalculate tangent plane for NYC
            updateTangentPlane();
            updateCameraLook();
        }
        
        function goToCenter() {
            // Position camera at the center of the globe
            camera.position.set(0, 0, 0);
            
            // Look toward equator/prime meridian (0°, 0°)
            const targetPoint = latLongToVector3(0, 0, CONFIG.globeRadius);
            lookDirection = targetPoint.clone().normalize();
            
            // Up vector: world up
            upVector = new THREE.Vector3(0, 1, 0);
            
            updateTangentPlane();
            updateCameraLook();
        }
        
        function updateTangentPlane() {
            // Recalculate tangent plane basis vectors for current camera position
            surfaceNormal = camera.position.clone().normalize();
            
            const worldUp = new THREE.Vector3(0, 1, 0);
            tangentEast = new THREE.Vector3().crossVectors(worldUp, surfaceNormal).normalize();
            tangentNorth = new THREE.Vector3().crossVectors(surfaceNormal, tangentEast).normalize();
        }
        
        function onKeyDown(e) {
            // Stop Space/arrows from scrolling the page or re-triggering a
            // focused button (Space on a focused button = click -> snapped home)
            if (e.key === ' ' || e.key.indexOf('Arrow') === 0) e.preventDefault();
            keysPressed[e.key] = true;
        }
        
        function onKeyUp(e) {
            keysPressed[e.key] = false;
        }
        
        function processKeyboard() {
            let changed = false;
            const ROTATION_SPEED = 0.02;
            
            // Yaw: Left/Right = rotate around world Y axis
            if (keysPressed['ArrowLeft'] || keysPressed['a'] || keysPressed['A']) {
                const yawAxis = new THREE.Vector3(0, 1, 0);
                lookDirection.applyAxisAngle(yawAxis, ROTATION_SPEED);
                upVector.applyAxisAngle(yawAxis, ROTATION_SPEED);
                changed = true;
            }
            if (keysPressed['ArrowRight'] || keysPressed['d'] || keysPressed['D']) {
                const yawAxis = new THREE.Vector3(0, 1, 0);
                lookDirection.applyAxisAngle(yawAxis, -ROTATION_SPEED);
                upVector.applyAxisAngle(yawAxis, -ROTATION_SPEED);
                changed = true;
            }
            
            // Pitch: Up/Down = rotate toward/away from Y axis (world up/down)
            if (keysPressed['ArrowUp'] || keysPressed['w'] || keysPressed['W']) {
                const rightVector = new THREE.Vector3().crossVectors(lookDirection, upVector).normalize();
                lookDirection.applyAxisAngle(rightVector, ROTATION_SPEED);
                upVector.applyAxisAngle(rightVector, ROTATION_SPEED);
                changed = true;
            }
            if (keysPressed['ArrowDown'] || keysPressed['s'] || keysPressed['S']) {
                const rightVector = new THREE.Vector3().crossVectors(lookDirection, upVector).normalize();
                lookDirection.applyAxisAngle(rightVector, -ROTATION_SPEED);
                upVector.applyAxisAngle(rightVector, -ROTATION_SPEED);
                changed = true;
            }
            
            // Roll: Q/E = rotate around look direction
            if (keysPressed['q'] || keysPressed['Q']) {
                upVector.applyAxisAngle(lookDirection, -ROTATION_SPEED);
                changed = true;
            }
            if (keysPressed['e'] || keysPressed['E']) {
                upVector.applyAxisAngle(lookDirection, ROTATION_SPEED);
                changed = true;
            }
            
            // Spacebar = fly forward, Shift+Space = fly backward
            if (keysPressed[' ']) {
                const FLY_SPEED = 0.01 * SCALE;  // Scales with globe size
                const direction = keysPressed['Shift'] ? -1 : 1;  // Backward if shift held
                const movement = lookDirection.clone().multiplyScalar(FLY_SPEED * direction);
                camera.position.add(movement);
                updateTangentPlane();
            }
            
            // Keep vectors normalized
            if (changed) {
                lookDirection.normalize();
                upVector.normalize();
                updateCameraLook();
            }
        }
        
        function updateCameraLook() {
            // Flight-sim style: use stored lookDirection and upVector
            // These are rotated by the controls around world axes
            
            const target = camera.position.clone().add(lookDirection);
            camera.up.copy(upVector);
            camera.lookAt(target);
        }

        // ============================================
        // COORDINATE CONVERSION
        // ============================================
        
        function latLongToVector3(lat, lon, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            
            return new THREE.Vector3(
                -radius * Math.sin(phi) * Math.cos(theta),
                radius * Math.cos(phi),
                radius * Math.sin(phi) * Math.sin(theta)
            );
        }

        // ============================================
        // CHECK IF IN NORTH AMERICA
        // ============================================
        
        function isInNorthAmerica(lat, lon) {
            // Rough bounding box for North America (including Central America & Caribbean)
            // Main continent
            if (lat > 15 && lat < 85 && lon > -170 && lon < -50) return true;
            // Alaska extension
            if (lat > 50 && lat < 72 && lon > -180 && lon < -130) return true;
            // Central America
            if (lat > 7 && lat < 25 && lon > -120 && lon < -60) return true;
            return false;
        }

        // ============================================
        // TERRAIN COLOR
        // ============================================
        
        function getTerrainColor(lat, lon) {
            const absLat = Math.abs(lat);
            
            if (absLat > 65) return DAY_COLORS.ice;
            if (absLat > 55) return DAY_COLORS.tundra;
            
            // Arid regions
            if ((lat > 15 && lat < 35 && lon > -20 && lon < 60) ||
                (lat > -35 && lat < -20 && lon > 115 && lon < 145)) {
                return DAY_COLORS.arid;
            }
            
            if (absLat < 20) return DAY_COLORS.tropical;
            if (absLat < 40) return DAY_COLORS.grass;
            
            return DAY_COLORS.forest;
        }

        // ============================================
        // GEOMETRY CREATION
        // ============================================
        
        function createCountryMesh(coordinates, properties) {
            coordinates.forEach(ring => {
                if (!ring || ring.length < 3) return;
                
                // Calculate centroid
                let centerLat = 0, centerLon = 0;
                ring.forEach(coord => {
                    centerLon += coord[0];
                    centerLat += coord[1];
                });
                centerLat /= ring.length;
                centerLon /= ring.length;
                
                // North America is now visible
                
                const terrainColor = getTerrainColor(centerLat, centerLon);
                
                const flatPoints = [];
                ring.forEach(coord => flatPoints.push(coord[0], coord[1]));
                
                let triangleIndices;
                try {
                    triangleIndices = earcut(flatPoints);
                } catch (e) { return; }
                
                if (triangleIndices.length < 3) return;
                
                const vertices = [];
                ring.forEach(coord => {
                    const v = latLongToVector3(coord[1], coord[0], CONFIG.globeRadius);
                    vertices.push(v.x, v.y, v.z);
                });
                
                // Front face (exterior)
                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
                geometry.setIndex(triangleIndices);
                geometry.computeVertexNormals();
                
                const frontMaterial = new THREE.MeshPhongMaterial({
                    color: terrainColor,
                    side: THREE.FrontSide,
                    flatShading: false,
                    shininess: 5
                });
                
                const frontMesh = new THREE.Mesh(geometry, frontMaterial);
                globe.add(frontMesh);
                
                // Track for day/night updates
                countryMeshes.push({
                    mesh: frontMesh,
                    lat: centerLat,
                    lon: centerLon,
                    dayColor: terrainColor
                });
                
                // Back face (interior) - dark grey
                const backGeometry = geometry.clone();
                const backMaterial = new THREE.MeshBasicMaterial({
                    color: INTERIOR_COLOR,
                    side: THREE.BackSide
                });
                
                const backMesh = new THREE.Mesh(backGeometry, backMaterial);
                globe.add(backMesh);
            });
        }

        // ============================================
        // GEOJSON LOADING
        // ============================================
        
        async function loadGeoJSON() {
            const sources = [
                'https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson',
                'https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_land.geojson'
            ];
            
            for (const url of sources) {
                try {
                    const response = await fetch(url);
                    if (response.ok) return await response.json();
                } catch (e) {
                    console.warn('Failed:', url);
                }
            }
            throw new Error('All sources failed');
        }

        function processGeoJSON(geojson) {
            geojson.features.forEach(feature => {
                const geometry = feature.geometry;
                const properties = feature.properties || {};
                
                if (geometry.type === 'Polygon') {
                    createCountryMesh(geometry.coordinates, properties);
                } else if (geometry.type === 'MultiPolygon') {
                    geometry.coordinates.forEach(polygon => {
                        createCountryMesh(polygon, properties);
                    });
                }
            });
        }

        // ============================================
        // ANIMATION
        // ============================================
        
        function animate() {
            requestAnimationFrame(animate);
            processKeyboard();
            updateDayNight();
            renderer.render(scene, camera);
        }

        // ============================================
        // INITIALIZATION
        // ============================================
        
        async function init() {
            initScene();
            
            try {
                const geojson = await loadGeoJSON();
                processGeoJSON(geojson);
                document.getElementById('loading').style.display = 'none';
                animate();
            } catch (error) {
                console.error('Init failed:', error);
                document.getElementById('loading').innerHTML = 'Failed to load data';
            }
        }

        init();
    </script>
</body>
