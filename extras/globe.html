<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continental Globe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a14;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        
        #controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .toggle-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            backdrop-filter: blur(10px);
        }
        
        .toggle-btn:hover {
            background: rgba(255,255,255,0.2);
        }
        
        .toggle-btn.active {
            background: rgba(78, 205, 196, 0.3);
            border-color: #4ecdc4;
        }
        
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            pointer-events: none;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 16px;
            letter-spacing: 1px;
            text-align: center;
        }
        
        .spinner {
            width: 36px;
            height: 36px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: #4ecdc4;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="loading">
        <div class="spinner"></div>
        Loading countries...
    </div>
    <div id="controls">
        <button class="toggle-btn" id="bordersBtn">Show Borders</button>
    </div>
    <div id="info">Click and drag to rotate</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Earcut for polygon triangulation -->
    <script src="https://cdn.jsdelivr.net/npm/earcut@2.2.4/dist/earcut.min.js"></script>
    
    <script>
        // ============================================
        // CONFIGURATION
        // ============================================
        const CONFIG = {
            globeRadius: 5,
            backgroundColor: 0x0a0a14,
            showBorders: false,
            borderColor: 0x1a1a2a,
            // Future features
            autoRotate: false,
            autoRotateSpeed: 0.002,
            enableZoom: false
        };

        // ============================================
        // TERRAIN COLOR PALETTE
        // ============================================
        const TERRAIN_COLORS = {
            // Greens - forests, temperate
            forest: [0x2d5a27, 0x3d6b37, 0x4a7a42, 0x2a5030],
            // Tans/Browns - arid, desert
            arid: [0x8b7355, 0x9c8565, 0xa89070, 0x7a6348],
            // Light greens - grassland
            grass: [0x6b8e4a, 0x7a9d5a, 0x5a7e3a, 0x8aad6a],
            // Ice/snow
            ice: [0xe8e8f0, 0xd8d8e8, 0xf0f0f8],
            // Tropical
            tropical: [0x228b22, 0x2e8b2e, 0x3a9b3a]
        };

        // ============================================
        // SCENE SETUP
        // ============================================
        let scene, camera, renderer, controls;
        let globe, bordersGroup;

        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(CONFIG.backgroundColor);
            
            camera = new THREE.PerspectiveCamera(
                45,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.z = 14;
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.rotateSpeed = 0.5;
            controls.enableZoom = CONFIG.enableZoom;
            controls.enablePan = false;
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 3, 5);
            scene.add(directionalLight);
            
            const fillLight = new THREE.DirectionalLight(0x4ecdc4, 0.2);
            fillLight.position.set(-5, -2, -5);
            scene.add(fillLight);
            
            // Containers
            globe = new THREE.Group();
            bordersGroup = new THREE.Group();
            bordersGroup.visible = CONFIG.showBorders;
            scene.add(globe);
            scene.add(bordersGroup);
            
            window.addEventListener('resize', onWindowResize);
            
            // Border toggle button
            document.getElementById('bordersBtn').addEventListener('click', toggleBorders);
        }

        function toggleBorders() {
            CONFIG.showBorders = !CONFIG.showBorders;
            bordersGroup.visible = CONFIG.showBorders;
            document.getElementById('bordersBtn').classList.toggle('active', CONFIG.showBorders);
            document.getElementById('bordersBtn').textContent = 
                CONFIG.showBorders ? 'Hide Borders' : 'Show Borders';
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ============================================
        // COORDINATE CONVERSION
        // ============================================
        
        function latLongToVector3(lat, lon, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            
            return new THREE.Vector3(
                -radius * Math.sin(phi) * Math.cos(theta),
                radius * Math.cos(phi),
                radius * Math.sin(phi) * Math.sin(theta)
            );
        }

        // ============================================
        // TERRAIN COLOR SELECTION
        // ============================================
        
        function getTerrainColor(lat, lon, countryName) {
            // Ice caps
            if (Math.abs(lat) > 65) {
                return TERRAIN_COLORS.ice[Math.floor(Math.random() * TERRAIN_COLORS.ice.length)];
            }
            
            // Arid regions (rough approximation)
            const isArid = (
                (lat > 15 && lat < 35 && lon > -20 && lon < 60) || // Sahara, Arabia
                (lat > 25 && lat < 40 && lon > 60 && lon < 80) ||  // Central Asia
                (lat > -35 && lat < -20 && lon > 115 && lon < 145) // Australia interior
            );
            
            if (isArid) {
                return TERRAIN_COLORS.arid[Math.floor(Math.random() * TERRAIN_COLORS.arid.length)];
            }
            
            // Tropical
            if (Math.abs(lat) < 20) {
                return TERRAIN_COLORS.tropical[Math.floor(Math.random() * TERRAIN_COLORS.tropical.length)];
            }
            
            // Temperate forests
            if (Math.abs(lat) > 40 && Math.abs(lat) < 60) {
                return TERRAIN_COLORS.forest[Math.floor(Math.random() * TERRAIN_COLORS.forest.length)];
            }
            
            // Default grassland
            return TERRAIN_COLORS.grass[Math.floor(Math.random() * TERRAIN_COLORS.grass.length)];
        }

        // ============================================
        // GEOMETRY CREATION - FLAT TRIANGULATED SURFACES
        // ============================================
        
        function createCountryMesh(coordinates, properties) {
            const countryGroup = new THREE.Group();
            
            coordinates.forEach(ring => {
                if (!ring || ring.length < 3) return;
                
                // Get centroid for color determination
                let centerLat = 0, centerLon = 0;
                ring.forEach(coord => {
                    centerLon += coord[0];
                    centerLat += coord[1];
                });
                centerLat /= ring.length;
                centerLon /= ring.length;
                
                const color = getTerrainColor(centerLat, centerLon, properties?.name);
                
                // Create flat 2D points for triangulation
                const flatPoints = [];
                ring.forEach(coord => {
                    flatPoints.push(coord[0], coord[1]);
                });
                
                // Triangulate using earcut
                let triangleIndices;
                try {
                    triangleIndices = earcut(flatPoints);
                } catch (e) {
                    return; // Skip problematic polygons
                }
                
                if (triangleIndices.length < 3) return;
                
                // Build 3D vertices on sphere surface
                const vertices = [];
                ring.forEach(coord => {
                    const v = latLongToVector3(coord[1], coord[0], CONFIG.globeRadius);
                    vertices.push(v.x, v.y, v.z);
                });
                
                // Create geometry
                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
                geometry.setIndex(triangleIndices);
                geometry.computeVertexNormals();
                
                const material = new THREE.MeshPhongMaterial({
                    color: color,
                    side: THREE.DoubleSide,
                    flatShading: false
                });
                
                const mesh = new THREE.Mesh(geometry, material);
                countryGroup.add(mesh);
                
                // Create border line
                const borderPoints = ring.map(coord => 
                    latLongToVector3(coord[1], coord[0], CONFIG.globeRadius + 0.01)
                );
                
                const borderGeometry = new THREE.BufferGeometry().setFromPoints(borderPoints);
                const borderMaterial = new THREE.LineBasicMaterial({ 
                    color: 0x2a2a3a,
                    transparent: true,
                    opacity: 0.7
                });
                const borderLine = new THREE.LineLoop(borderGeometry, borderMaterial);
                bordersGroup.add(borderLine);
            });
            
            return countryGroup;
        }

        // ============================================
        // GEOJSON LOADING
        // ============================================
        
        async function loadGeoJSON() {
            try {
                // Try to load country-level data first
                const response = await fetch(
                    'https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson'
                );
                if (!response.ok) throw new Error('Country data failed');
                return await response.json();
            } catch (error) {
                console.warn('Country data failed, trying land data...');
                try {
                    const response = await fetch(
                        'https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_land.geojson'
                    );
                    return await response.json();
                } catch (e) {
                    console.warn('Remote data failed, using embedded data');
                    return getEmbeddedData();
                }
            }
        }

        function processGeoJSON(geojson) {
            geojson.features.forEach(feature => {
                const geometry = feature.geometry;
                const properties = feature.properties || {};
                
                if (geometry.type === 'Polygon') {
                    const mesh = createCountryMesh(geometry.coordinates, properties);
                    if (mesh) globe.add(mesh);
                } else if (geometry.type === 'MultiPolygon') {
                    geometry.coordinates.forEach(polygon => {
                        const mesh = createCountryMesh(polygon, properties);
                        if (mesh) globe.add(mesh);
                    });
                }
            });
        }

                    {

                                [-20, 78], [-18, 82], [-32, 83], [-48, 82],

        }

        // ============================================
        // ANIMATION
        // ============================================
        
        function animate() {
            requestAnimationFrame(animate);
            
            if (CONFIG.autoRotate) {
                globe.rotation.y += CONFIG.autoRotateSpeed;
                bordersGroup.rotation.y += CONFIG.autoRotateSpeed;
            }
            
            controls.update();
            renderer.render(scene, camera);
        }

        // ============================================
        // INITIALIZATION
        // ============================================
        
        async function init() {
            initScene();
            
            try {
                const geojson = await loadGeoJSON();
                processGeoJSON(geojson);
                document.getElementById('loading').style.display = 'none';
                animate();
            } catch (error) {
                console.error('Init failed:', error);
                document.getElementById('loading').innerHTML = 'Failed to load data';
            }
        }

        init();
    </script>
</body>
</html>
